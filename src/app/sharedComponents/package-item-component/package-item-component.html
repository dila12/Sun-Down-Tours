<div class="tour-card" [routerLink]="tour.routerLink">

    <div class="tour-image">

        <img
            [src]="imagePath"
            [alt]="tour.title"
            loading="lazy"
            decoding="async">

        <div class="overlay"></div>

        <div class="card-actions">
            <i class="fa fa-heart"></i>
            <i class="fa fa-eye"></i>
        </div>

        <div class="price-badge">
            $ {{ (tour.price / 2) | number:'1.0-0' }}
            <span>/ person</span>
        </div>

    </div>

    <div class="tour-content">

        <div class="top-info">
            <span>
                <i class="fa fa-calendar-alt"></i>
                {{ tour.days }}
            </span>

            <span>
                <i class="fa fa-user"></i>
                {{ tour.persons }}
            </span>
        </div>

        <h3 class="tour-title">
            {{ tour.title }}
        </h3>

        <div class="tour-tags">
            <span><i class="fa fa-check-circle"></i> Free Cancel</span>
            <span><i class="fa fa-bolt"></i> Instant Confirm</span>
            <span><i class="fa fa-credit-card"></i> Pay Later</span>
        </div>

    </div>

</div>
