<a class="tour-card" [routerLink]="link">

    <div class="tour-image">

        <img
            [src]="imageSrc"
            [srcset]="imageSrcSet || null"
            [sizes]="imageSrcSet ? defaultSizes() : null"
            [attr.data-img-base]="imagePath"
            [alt]="alt"
            width="400"
            height="260"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
            (error)="onImageError($event)">

        <div class="overlay"></div>

        <div class="card-actions" aria-hidden="true">
            <i class="fa fa-heart"></i>
            <i class="fa fa-eye"></i>
        </div>

        <div class="price-badge">
            $ {{ ((tour.price ?? 0) / 2) | number:'1.0-0' }}
            <span>{{ 'common.card.perPerson' | t }}</span>
        </div>

    </div>

    <div class="tour-content">

        <div class="top-info">
            <span>
                <i class="fa fa-calendar-alt" aria-hidden="true"></i>
                {{ tour.days }}
            </span>

            <span>
                <i class="fa fa-user" aria-hidden="true"></i>
                {{ tour.persons }}
            </span>
        </div>

        <h3 class="tour-title">
            {{ tour.title }}
        </h3>

        <div class="tour-tags">
            <span><i class="fa fa-check-circle" aria-hidden="true"></i> {{ 'common.card.freeCancel' | t }}</span>
            <span><i class="fa fa-bolt" aria-hidden="true"></i> {{ 'common.card.instantConfirm' | t }}</span>
            <span><i class="fa fa-credit-card" aria-hidden="true"></i> {{ 'common.card.payLater' | t }}</span>
        </div>

    </div>

</a>
