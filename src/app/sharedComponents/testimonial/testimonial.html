<!-- Testimonial Start -->
<div class="container-fluid py-5">
  <div class="container py-5">
    <div class="text-center mb-3 pb-3">
      <h6 class="text-primary text-uppercase" style="letter-spacing: 5px;">{{ 'testimonials.eyebrow' | t }}</h6>
      <h1>{{ 'testimonials.title' | t }}</h1>
    </div>

    <div class="testimonial-carousel" role="region" aria-roledescription="carousel" [attr.aria-label]="'testimonials.ariaCarousel' | t">
      @for (item of items; track trackByIndex($index); let i = $index) {
      <div class="testimonial-slide text-center pb-4" [class.is-active]="i === activeIndex"
        [attr.aria-hidden]="i !== activeIndex" [attr.inert]="i !== activeIndex ? '' : null">
        <img class="img-fluid mx-auto" [src]="item.image" [alt]="'testimonials.ariaSlide' | t" width="100" height="100"
          loading="lazy" decoding="async" fetchpriority="low" style="width: 100px; height: 100px;">
        <div class="testimonial-text bg-white p-4 mt-n5">
          <p class="mt-5">{{ item.quote }}</p>
          <h5 class="text-truncate">{{ item.name }}</h5>
          <span>{{ item.role }}</span>
        </div>
      </div>
      }
    </div>

    <div class="testimonial-dots" role="tablist" [attr.aria-label]="'testimonials.ariaCarousel' | t">
      @for (item of items; track trackByIndex($index); let i = $index) {
      <button type="button" class="testimonial-dot" [class.active]="i === activeIndex"
        [attr.aria-selected]="i === activeIndex" [attr.aria-label]="'testimonials.ariaSlide' | t"
        (click)="goTo(i)"></button>
      }
    </div>
  </div>
</div>
<!-- Testimonial End -->
