@if (items().length) {
<section class="container py-5 faq-section">
  <div class="text-center mb-4">
    <h2 class="section-title">{{ title() }}</h2>
  </div>
  <div class="faq-list mx-auto" style="max-width: 820px;">
    @for (item of items(); track item.q) {
    <details class="faq-item mb-3 p-3 bg-white rounded shadow-sm">
      <summary class="faq-question font-weight-bold" style="cursor: pointer;">{{ item.q }}</summary>
      <p class="faq-answer mt-2 mb-0">{{ item.a }}</p>
    </details>
    }
  </div>
</section>
}
