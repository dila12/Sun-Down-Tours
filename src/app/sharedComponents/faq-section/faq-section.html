@if (items().length) {
<section class="faq-band" [attr.aria-labelledby]="headingId()">
  <div class="container">
    <header class="faq-head">
      <h2 [id]="headingId()" class="faq-title">{{ title() }}</h2>
    </header>
    <div class="faq-list">
      @for (item of items(); track item.q; let first = $first) {
      <details class="faq-item" [open]="first">
        <summary>
          <span>{{ item.q }}</span>
          <span class="faq-chevron" aria-hidden="true"></span>
        </summary>
        <p class="faq-answer aeo-answer">{{ item.a }}</p>
      </details>
      }
    </div>
  </div>
</section>
}
