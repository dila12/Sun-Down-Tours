<router-outlet></router-outlet>

@if (showConsentBanner) {
  <section
    class="cookie-banner"
    role="dialog"
    aria-modal="false"
    aria-labelledby="cookie-title"
    aria-describedby="cookie-description">

    <div class="cookie-header">
      <div class="cookie-icon" aria-hidden="true">
        <i class="fas fa-shield-alt"></i>
      </div>

      <div class="cookie-heading">
        <strong id="cookie-title">{{ 'common.consent.title' | t }}</strong>
        <span>{{ 'common.consent.subtitle' | t }}</span>
      </div>
    </div>

    <p id="cookie-description" class="cookie-description">
      {{ 'common.consent.message' | t }}
    </p>

    <div class="cookie-footer">
      <a [href]="privacyPath" class="privacy-link">
        {{ 'common.consent.privacy' | t }}
      </a>

      <div class="cookie-actions">
        <button
          type="button"
          class="reject-btn"
          (click)="rejectCookies()">
          {{ 'common.consent.reject' | t }}
        </button>

        <button
          type="button"
          class="accept-btn"
          (click)="acceptCookies()">
          {{ 'common.consent.accept' | t }}
        </button>
      </div>
    </div>
  </section>
}
