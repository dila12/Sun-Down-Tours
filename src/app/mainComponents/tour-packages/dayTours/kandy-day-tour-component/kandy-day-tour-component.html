<app-tour-gallery
    galleryId="kandy-day"
    [alt]="'common.tourUi.imageAlt' | t"
    [previewAlt]="'common.tourUi.previewAlt' | t"
    (currentSrcChange)="onGallerySrc($event)">
</app-tour-gallery>

<div class="mt-4">
    <app-tour-details-component
        [tour]="tourForDetails"
        [filecode]="filecode"
        [image]="currentImage"
        [bookingTour]="bookingTour">
    </app-tour-details-component>
</div>


<div class="container-fluid py-5">
    <div class="container pt-5 pb-3">
        <div class="text-center mb-3 pb-3">
            <p class="text-primary text-uppercase mb-2" style="letter-spacing: 5px; font-weight: 600; font-size: 0.9rem;">{{ 'common.tourUi.relatedEyebrow' | t }}</p>
            <h2>{{ 'common.tourUi.relatedTitle' | t }}</h2>
        </div>
        <div class="row">
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let tour of selectedTours; trackBy: trackByTour">
                <app-package-item-component [tour]="tour">
                </app-package-item-component>
            </div>
        </div>

    </div>
</div>
