<!-- Header Start -->
<div class="container-fluid page-header">
    <div class="container">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
            <p class="display-4 text-white text-uppercase mb-2" role="heading" aria-level="2">{{ 'tours.header' | t }}</p>
            <div class="d-inline-flex text-white">
                <p class="m-0 text-uppercase"><a class="text-white" [routerLink]="path('home')">{{ 'common.breadcrumb.home' | t }}</a></p>
                <i class="fa fa-angle-double-right pt-1 px-3"></i>
                <p class="m-0 text-uppercase">{{ 'tours.breadcrumb' | t }}</p>
            </div>
        </div>
    </div>
</div>
<!-- Header End -->


<!-- Packages Start -->
<div class="container-fluid  bg-light">
    <div class="container pt-5 pb-3">
        <div class="text-center ">
            <h6 class="text-primary text-uppercase tracking-widest">{{ 'tours.eyebrow' | t }}</h6>
            <h1 class="font-bold text-4xl">{{ 'tours.title' | t }}</h1>
            <p class="section-subtitle mx-auto mt-3" style="max-width: 760px;">{{ 'tours.lead' | t }}</p>
        </div>

        <div class="flex text-center mb-4 relative">
            <button class="tab-btn-outline" [class.active]="activeTab==='multi'" (click)="setTab('multi')">
                {{ 'home.packages.multiDay' | t }}
            </button>
            <button class="tab-btn-outline" [class.active]="activeTab==='day'" (click)="setTab('day')">
                {{ 'home.packages.day' | t }}
            </button>

        </div>


        <!-- Tab Content -->
        <div class="row">
            <div *ngFor="let tour of activeTab==='day' ? dayTours : multiDayTours; trackBy: trackByTour; let i = index"
                class="col-lg-4 col-md-6 mb-4 package-card-wrapper" [style.--i]="i">
                <app-package-item-component [tour]="tour">
                </app-package-item-component>
            </div>
        </div>

    </div>
</div>



<!-- Packages End -->

<app-faq-section faqKey="tours.faq" titleKey="tours.faqTitle" />

<router-outlet></router-outlet>
<!-- Destination Start -->
