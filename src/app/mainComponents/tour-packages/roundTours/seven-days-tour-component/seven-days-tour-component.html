<div class="container pt-5 text-center">
    <h1 class="mb-3">{{ 'tour7.title' | t }}</h1>
    <p class="mx-auto" style="max-width: 820px;">{{ 'tour7.lead' | t }}</p>
</div>

<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 text-center">
            <div class="d-flex align-items-start">
                <div class="main-image-container">
                    <img [src]="currentImage" class="main-img rounded shadow" [alt]="'common.tourUi.imageAlt' | t" />
                    <div class="indicators">
                        <span *ngFor="let img of images; let i = index" (click)="goToImage(i)"
                            [class.active-indicator]="i === currentIndex" class="indicator-dot"></span>
                    </div>
                </div>

                <div class="d-flex flex-column thumbs">
                    <div *ngFor="let img of nextImages" class="thumb-img" (click)="goToImageFromThumb(img.index)">
                        <img [src]="img.src" class="img-thumbnail rounded" [alt]="'common.tourUi.previewAlt' | t" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <app-tour-details-component
        [tour]="tourForDetails"
        [filecode]="filecode"
        [image]="currentImage"
        [bookingTour]="bookingTour">
    </app-tour-details-component>
</div>


<div class="container-fluid py-5">
    <div class="container pt-5 pb-3">
        <div class="text-center mb-3 pb-3">
            <h6 class="text-primary text-uppercase" style="letter-spacing: 5px;">{{ 'common.tourUi.relatedEyebrow' | t }}</h6>
            <h2>{{ 'common.tourUi.relatedTitle' | t }}</h2>
        </div>
        <div class="row">
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let tour of selectedTours">
                <app-package-item-component [tour]="tour">
                </app-package-item-component>
            </div>
        </div>

    </div>
</div>

<app-faq-section faqKey="tour7.faq" titleKey="tour7.faqTitle" />
