<section class="container py-5 text-center">
  <h2 class="mb-4">{{ 'home.popular.title' | t }}</h2>
  <div class="row justify-content-center">
    @for (tour of popularTours; track tour.pageId) {
    <div class="col-md-3 mb-3">
      <a [routerLink]="path(tour.pageId)" class="btn btn-outline-primary w-100">
        {{ tour.labelKey | t }}
      </a>
    </div>
    }
  </div>
</section>
