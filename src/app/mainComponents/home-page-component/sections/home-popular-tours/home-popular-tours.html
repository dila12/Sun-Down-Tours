<section class="popular" aria-labelledby="popular-tours-heading">
  <div class="container">
    <header class="popular-head">
      <p class="popular-eyebrow">{{ 'home.packages.tag' | t }}</p>
      <h2 id="popular-tours-heading">{{ 'home.popular.title' | t }}</h2>
      <p>{{ 'home.packages.subtitle' | t }}</p>
    </header>

    <ul class="popular-grid">
      @for (tour of tours(); track tour.pageId) {
      <li>
        <a class="popular-card" [routerLink]="path(tour.pageId)">
          <span class="popular-photo">
            <img
              [src]="bestImageSrc(tour.image, 400)"
              [srcset]="buildSrcSet(tour.image)"
              sizes="(max-width: 575px) 100vw, (max-width: 991px) 50vw, 280px"
              [attr.data-img-base]="tour.image"
              [alt]="tour.imageAlt"
              width="400"
              height="240"
              loading="lazy"
              decoding="async"
              (error)="onImageError($event)" />
            <span class="popular-days">{{ tour.days }}</span>
          </span>
          <span class="popular-body">
            <span class="popular-title">{{ tour.labelKey | t }}</span>
            <span class="popular-cta">{{ 'common.cta.viewTour' | t }}</span>
          </span>
        </a>
      </li>
      }
    </ul>
  </div>
</section>
